<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SRC</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f6f6b">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SRC">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--bg:#eef1ee;--ink:#1d2928;--mut:#6a7776;--acc:#1f6f6b}
@media (prefers-color-scheme:dark){:root{--bg:#141b1b;--ink:#e6eeec;--mut:#8fa09d;--acc:#58b8b1}}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
#ld{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:2;transition:opacity .3s}
#ld img{width:64px;height:64px;border-radius:16px}
#ld.gone{opacity:0;pointer-events:none}
#ld small{color:var(--mut)}
#cfg{max-width:420px;margin:60px auto;padding:0 20px}
#cfg code{background:rgba(0,0,0,.06);padding:2px 5px;border-radius:4px;word-break:break-all}
</style>
</head>
<body>
<div id="ld"><img src="icon-192.png" alt=""><small>Opening SRC…</small></div>
<iframe id="app" title="SRC" allow="clipboard-write" credentialless></iframe>
<script>
// ============================================================
// The only line to change: the web app address of the "Admin app"
// deployment (Apps Script > Deploy > Manage deployments). It ends in /exec.
var APP_URL = 'https://script.google.com/macros/s/AKfycbxvnlN2IsML0dANAC0XwZQWAwtDEE7DLPKSXm76dCcL7WAGFZ1RMzHOixl0j244E-Hp/exec';
// ============================================================

(function () {
  var frame = document.getElementById('app'), ld = document.getElementById('ld'), KEY = 'srcTok';
  function get() { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } }
  function set(v) { try { v ? localStorage.setItem(KEY, v) : localStorage.removeItem(KEY); } catch (e) { } }
  if (!/^https:\/\/script\.google\.com\/.+\/exec/.test(APP_URL)) {
    ld.remove(); frame.remove();
    document.body.innerHTML = '<div id="cfg"><h2>Almost there</h2><p>Open <code>index.html</code> and paste the Admin app link (it ends in <code>/exec</code>) into the line that starts with <code>var APP_URL</code>.</p></div>';
    return;
  }
  function open() { frame.src = APP_URL + (APP_URL.indexOf('?') < 0 ? '?' : '&') + 'home=1&t=' + Date.now(); }
  frame.addEventListener('load', function () { setTimeout(function () { ld.classList.add('gone'); }, 400); });
  // The app runs inside Google's frames. It asks this page for the saved sign-in key, and tells it about new or removed keys,
  // so a phone stays signed in. Only messages from Google's app frames inside this page are accepted.
  function fromApp(e) {
    if (!/^https:\/\/([\w-]+\.)*(googleusercontent\.com|script\.google\.com)$/.test(e.origin)) return false;
    var w = e.source; for (var i = 0; i < 6 && w; i++) { if (w === frame.contentWindow) return true; if (w === w.parent) break; w = w.parent; }
    return false;
  }
  window.addEventListener('message', function (e) {
    var d = e.data; if (!d || !d.srcapp || !fromApp(e)) return;
    if (d.hello) { e.source.postMessage({ srcapp: 1, token: get() }, e.origin); return; }
    if ('token' in d) set(d.token || '');
    if (d.reload) { ld.classList.remove('gone'); open(); }
  });
  open();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () { });
})();
</script>
</body>
</html>
